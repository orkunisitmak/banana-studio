name: Verify source and data boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web-and-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:desktop
      - run: node scripts/audit-public-release.mjs --history
      - name: Independent Git history secret scan
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
      - name: Fresh database ownership and access tests
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          PG_TEST_BIN=/usr/lib/postgresql/16/bin npm run test:database
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run build
      - run: npm run build:desktop
      - run: swift build --package-path desktop/macos -c release
      - run: swift test --package-path desktop/macos
      - run: node scripts/fetch-node-runtime.mjs
      - run: node scripts/package-macos.mjs --development
        env:
          BANANA_NODE_RUNTIME: ${{ github.workspace }}/.build/node-runtime/bin/node
      - run: node scripts/test-local-generation.mjs
      - run: node scripts/test-update-signatures.mjs
      - run: node scripts/audit-distribution.mjs ".build/staging/Banana Studio.app"
      - name: Prepare community app without accessing any release signing key
        run: node scripts/package-macos.mjs --community --prepare
        env:
          BANANA_NODE_RUNTIME: ${{ github.workspace }}/.build/node-runtime/bin/node
          BANANA_BUILD_NUMBER: '7'
      - run: node scripts/test-local-generation.mjs
      - run: node scripts/audit-distribution.mjs ".build/staging/Banana Studio.app"
      - name: Archive the audited app with permissions and framework links
        run: ditto -c -k --sequesterRsrc --keepParent ".build/staging/Banana Studio.app" ".build/Banana-Studio-prepared-${{ matrix.architecture }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-macos-${{ matrix.architecture }}
          path: .build/Banana-Studio-prepared-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.426
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:desktop
      - run: node scripts/fetch-node-runtime.mjs
      - run: node scripts/package-windows.mjs
      - name: Test Windows Credential Manager in an isolated test namespace
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.build/staging-windows/Banana Studio/BananaStudio.exe' -ArgumentList '--test-vault' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Credential Manager test failed.' }
      - name: Test isolated window placement and removed-display restoration
        shell: pwsh
        run: |
          $app = Start-Process -FilePath '.build/staging-windows/Banana Studio/BananaStudio.exe' -ArgumentList '--test-window-placement' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Window placement test failed.' }
      - run: node scripts/test-local-generation.mjs
      - name: Archive the audited standalone Windows application
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archive = ".build/Banana-Studio-$version-windows-x64.zip"
          Compress-Archive -Path '.build/staging-windows/Banana Studio' -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version=$version; sourceCommit=(git rev-parse HEAD); platform='windows-x64'; sha256=$hash; distribution='unsigned-community'; nativeUiVerification='not-performed-by-CI'} | ConvertTo-Json | Set-Content '.build/verification-windows-x64.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-windows-x64
          # Only the two allowlisted release outputs below are uploaded.
          include-hidden-files: true
          path: |
            .build/Banana-Studio-*-windows-x64.zip
            .build/verification-windows-x64.json
          if-no-files-found: error
          retention-days: 7
